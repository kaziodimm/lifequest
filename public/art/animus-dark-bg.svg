<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-label="Animus Dark life strategy star chart background">
  <defs>
    <radialGradient id="void" cx="50%" cy="48%" r="78%">
      <stop offset="0%" stop-color="#111b31"/>
      <stop offset="46%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7d778" stop-opacity="0.9"/>
      <stop offset="8%" stop-color="#f6c453" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#4ce0d2" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4ce0d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="18%" cy="35%" r="46%">
      <stop offset="0%" stop-color="#4ce0d2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4ce0d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="86%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#9b7cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldMist" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#f6c453" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ce0d2" stop-opacity="0"/>
      <stop offset="28%" stop-color="#4ce0d2" stop-opacity="0.12"/>
      <stop offset="58%" stop-color="#9b7cff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9b7cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1.05" fill="#ffffff" opacity="0.34"/>
      <circle cx="84" cy="44" r="0.9" fill="#4ce0d2" opacity="0.42"/>
      <circle cx="104" cy="98" r="1.2" fill="#f6c453" opacity="0.22"/>
      <circle cx="43" cy="108" r="0.75" fill="#ffffff" opacity="0.22"/>
    </pattern>
    <pattern id="microGrid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M 86 0 L 0 0 0 86" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M 0 86 L 86 0" fill="none" stroke="#4ce0d2" stroke-opacity="0.024" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="2400" fill="url(#void)"/>
  <rect width="1600" height="2400" fill="url(#cyan)"/>
  <rect width="1600" height="2400" fill="url(#violet)"/>
  <path d="M 30 1970 C 260 1620 220 1220 490 900 C 700 650 920 560 1520 240" fill="none" stroke="url(#rift)" stroke-width="210" stroke-linecap="round" opacity="0.42"/>
  <path d="M 80 420 C 300 810 490 945 720 1150 C 980 1380 1160 1600 1500 2050" fill="none" stroke="url(#rift)" stroke-width="150" stroke-linecap="round" opacity="0.22"/>
  <rect width="1600" height="2400" fill="url(#stars)" opacity="0.7"/>
  <rect width="1600" height="2400" fill="url(#microGrid)" opacity="0.62"/>

  <g transform="translate(800 1200)" opacity="0.94">
    <circle r="455" fill="url(#core)"/>
    <circle r="175" fill="none" stroke="#f6c453" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="2 12"/>
    <circle r="260" fill="none" stroke="#f6c453" stroke-opacity="0.15" stroke-width="1"/>
    <circle r="388" fill="none" stroke="#4ce0d2" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="1 20"/>
    <circle r="560" fill="none" stroke="#ffffff" stroke-opacity="0.065" stroke-width="1" stroke-dasharray="1 28"/>
    <circle r="760" fill="none" stroke="#9b7cff" stroke-opacity="0.055" stroke-width="1" stroke-dasharray="1 36"/>
    <circle r="960" fill="none" stroke="#f6c453" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="1 44"/>

    <g stroke-linecap="round" filter="url(#softGlow)">
      <path d="M 0 -92 C 36 -330 45 -535 25 -850" fill="none" stroke="#74d680" stroke-opacity="0.18" stroke-width="4"/>
      <path d="M 130 -88 C 300 -255 455 -415 620 -690" fill="none" stroke="#9b7cff" stroke-opacity="0.16" stroke-width="4"/>
      <path d="M 175 12 C 365 52 555 92 815 180" fill="none" stroke="#f6c453" stroke-opacity="0.16" stroke-width="4"/>
      <path d="M 90 155 C 205 360 325 555 520 805" fill="none" stroke="#4ce0d2" stroke-opacity="0.16" stroke-width="4"/>
      <path d="M -118 132 C -275 335 -430 530 -650 775" fill="none" stroke="#55b8ff" stroke-opacity="0.15" stroke-width="4"/>
      <path d="M -178 -6 C -405 40 -600 55 -835 20" fill="none" stroke="#ff8ab3" stroke-opacity="0.14" stroke-width="4"/>
      <path d="M -126 -120 C -345 -300 -505 -475 -675 -735" fill="none" stroke="#ff9f5a" stroke-opacity="0.15" stroke-width="4"/>
    </g>

    <g fill="none" stroke="#f6c453" stroke-opacity="0.1" stroke-width="1">
      <path d="M -960 0 H 960"/>
      <path d="M 0 -1010 V 1010"/>
      <path d="M -678 -678 L 678 678"/>
      <path d="M 678 -678 L -678 678"/>
    </g>

    <g filter="url(#nodeGlow)">
      <circle cx="0" cy="0" r="6" fill="#f6c453" opacity="0.82"/>
      <circle cx="0" cy="-92" r="7" fill="#74d680" opacity="0.54"/>
      <circle cx="130" cy="-88" r="7" fill="#9b7cff" opacity="0.54"/>
      <circle cx="175" cy="12" r="7" fill="#f6c453" opacity="0.54"/>
      <circle cx="90" cy="155" r="7" fill="#4ce0d2" opacity="0.54"/>
      <circle cx="-118" cy="132" r="7" fill="#55b8ff" opacity="0.54"/>
      <circle cx="-178" cy="-6" r="7" fill="#ff8ab3" opacity="0.5"/>
      <circle cx="-126" cy="-120" r="7" fill="#ff9f5a" opacity="0.52"/>
      <circle cx="25" cy="-850" r="5" fill="#74d680" opacity="0.34"/>
      <circle cx="620" cy="-690" r="5" fill="#9b7cff" opacity="0.34"/>
      <circle cx="815" cy="180" r="5" fill="#f6c453" opacity="0.34"/>
      <circle cx="520" cy="805" r="5" fill="#4ce0d2" opacity="0.34"/>
      <circle cx="-650" cy="775" r="5" fill="#55b8ff" opacity="0.34"/>
      <circle cx="-835" cy="20" r="5" fill="#ff8ab3" opacity="0.3"/>
      <circle cx="-675" cy="-735" r="5" fill="#ff9f5a" opacity="0.32"/>
    </g>
  </g>

  <g opacity="0.18" stroke="#f6c453" stroke-width="1" fill="none">
    <circle cx="800" cy="1200" r="1130" stroke-dasharray="2 44"/>
    <circle cx="800" cy="1200" r="1280" stroke-dasharray="1 58"/>
  </g>

  <rect width="1600" height="2400" fill="url(#goldMist)" opacity="0.75"/>
  <rect width="1600" height="2400" fill="#02040a" opacity="0.12"/>
</svg>
