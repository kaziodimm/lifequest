<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="Animus Dark constellation background">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101a2f"/>
      <stop offset="46%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#03050c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6c453" stop-opacity="0.28"/>
      <stop offset="34%" stop-color="#4ce0d2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4ce0d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="22%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#4ce0d2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4ce0d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="82%" cy="20%" r="42%">
      <stop offset="0%" stop-color="#9b7cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="78%" cy="80%" r="44%">
      <stop offset="0%" stop-color="#ff8ab3" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ff8ab3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="132" height="132" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1.1" fill="#ffffff" opacity="0.34"/>
      <circle cx="84" cy="44" r="0.9" fill="#4ce0d2" opacity="0.42"/>
      <circle cx="112" cy="102" r="1.2" fill="#f6c453" opacity="0.22"/>
      <circle cx="43" cy="108" r="0.8" fill="#ffffff" opacity="0.22"/>
    </pattern>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <path d="M 0 96 L 96 0" fill="none" stroke="#4ce0d2" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2400" height="1600" fill="url(#void)"/>
  <rect width="2400" height="1600" fill="url(#cyan)"/>
  <rect width="2400" height="1600" fill="url(#violet)"/>
  <rect width="2400" height="1600" fill="url(#rose)"/>
  <rect width="2400" height="1600" fill="url(#stars)" opacity="0.72"/>
  <rect width="2400" height="1600" fill="url(#grid)" opacity="0.72"/>

  <g transform="translate(1200 800)" opacity="0.8">
    <circle r="310" fill="url(#core)"/>
    <circle r="252" fill="none" stroke="#f6c453" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 18"/>
    <circle r="430" fill="none" stroke="#4ce0d2" stroke-opacity="0.08" stroke-width="1.2" stroke-dasharray="1 24"/>
    <circle r="610" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" stroke-dasharray="1 30"/>
    <circle r="800" fill="none" stroke="#9b7cff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="1 38"/>
    <g stroke-linecap="round" filter="url(#softGlow)">
      <path d="M -20 -310 C 60 -520 120 -590 200 -760" fill="none" stroke="#74d680" stroke-opacity="0.16" stroke-width="3"/>
      <path d="M 255 -210 C 470 -350 620 -410 790 -560" fill="none" stroke="#9b7cff" stroke-opacity="0.14" stroke-width="3"/>
      <path d="M 328 42 C 560 90 740 118 960 210" fill="none" stroke="#f6c453" stroke-opacity="0.14" stroke-width="3"/>
      <path d="M 150 294 C 300 500 410 610 570 760" fill="none" stroke="#4ce0d2" stroke-opacity="0.14" stroke-width="3"/>
      <path d="M -270 185 C -430 380 -570 500 -760 645" fill="none" stroke="#55b8ff" stroke-opacity="0.13" stroke-width="3"/>
      <path d="M -330 -35 C -555 15 -730 20 -960 0" fill="none" stroke="#ff8ab3" stroke-opacity="0.12" stroke-width="3"/>
      <path d="M -240 -205 C -450 -350 -590 -480 -760 -620" fill="none" stroke="#ff9f5a" stroke-opacity="0.13" stroke-width="3"/>
    </g>
    <g fill="#ffffff" opacity="0.32">
      <circle cx="-20" cy="-310" r="2"/>
      <circle cx="255" cy="-210" r="2"/>
      <circle cx="328" cy="42" r="2"/>
      <circle cx="150" cy="294" r="2"/>
      <circle cx="-270" cy="185" r="2"/>
      <circle cx="-330" cy="-35" r="2"/>
      <circle cx="-240" cy="-205" r="2"/>
    </g>
  </g>

  <rect width="2400" height="1600" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2"/>
  <rect width="2400" height="1600" fill="url(#void)" opacity="0.18"/>
</svg>
